version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Espera 14 dias antes de sugerir uma versão nova (reduz risco de pacote comprometido recém-publicado)
    cooldown:
      default-days: 14
    groups:
      dependencias:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
